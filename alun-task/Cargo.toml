[package]
name = "alun-task"
description = "Alun async task framework: Kafka-driven task submission, processing, retry with DLQ and lifecycle management"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/alun-task"
readme = "README.md"
rust-version.workspace = true
keywords = ["task", "async", "kafka", "retry", "dlq"]
categories = ["asynchronous", "web-programming", "network-programming"]

[dependencies]
alun-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
rdkafka = { workspace = true, optional = true }
inventory = { workspace = true }

[features]
# 默认只启用「任务模型」——handler 注册 / 存储抽象 / 类型 / 重试策略，
# **不引入 Kafka**。`rdkafka` 需要 CMake + C 工具链构建 librdkafka，
# 在纯 Windows 工具链下无法构建，因此不能作为默认。
default = ["model"]

# 任务模型：注册表、存储抽象、任务类型与生命周期、重试延迟策略。
# 无任何外部系统依赖，可用 `#[task_handler]` 宏做编译期收集。
model = []

# Kafka 后端：生产者、消费者 worker、重试扫描器、`TaskPlugin`。
# 开启后传递依赖 `rdkafka`（需要 CMake + C 工具链）。
kafka = ["dep:rdkafka"]