[package]
name = "alun-utils"
description = "Alun utilities: string manipulation, date handling, masking, ID generation, validation, crypto, web helpers"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/alun-utils"
readme = "README.md"
rust-version.workspace = true
keywords = ["utilities", "validation", "crypto", "uuid", "date"]
categories = ["development-tools", "web-programming"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4.45", features = ["serde"] }
sha2 = "0.11"
hmac = "0.13"
base64 = "0.23"
hex = "0.4.3"
rand = "0.10"
aes-gcm = "0.11"
argon2 = "0.6"
bcrypt = "0.19"
regex = "1.13"
url = "2.5"
uuid = { version = "1.26", features = ["v4", "v7"] }
validator = { workspace = true, optional = true }
ammonia = { version = "4.2", optional = true }
csv = "1.4"
# 真 XLSX（F9）：两者都不进默认依赖，只有 `xlsx` feature 才拉入。
rust_xlsxwriter = { workspace = true, optional = true }
calamine = { workspace = true, optional = true }
alun-core = { workspace = true }
http = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros"] }
async-trait = { workspace = true }

[features]
default = []
validator-integration = ["validator"]
xss = ["ammonia"]
# 真 XLSX（OOXML）：`Export::to_xlsx_*` 生成工作簿，`Import::from_xlsx*` 解析。
# 不开本 feature 时，这些 API **不存在**（而不是「存在但返回 CSV」）——名实不符
# 的旧 `to_xlsx` 已被删除，见 `docs/reference/crates/observability.md`。
xlsx = ["dep:rust_xlsxwriter", "dep:calamine"]
