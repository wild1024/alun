[package]
name = "alun-db-core"
version.workspace = true
edition = "2024"
description = "alun-db 核心类型与 trait 定义，零运行时、零驱动、零生态依赖"
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = "2.0.20"
# 仅编译期过程宏（不引入运行时）：为 `AsyncHook` 提供 dyn 兼容的异步 trait 方法。
async-trait = { workspace = true }
# 可观测性埋点（F10）：可选，未启用时 `metrics` 相关代码整段不编译。
metrics = { workspace = true, optional = true }

# 生态类型支持（可选）
chrono       = { version = "0.4.45", optional = true }
time         = { version = "0.3.55", optional = true }
jiff         = { version = "0.2.37", optional = true, package = "jiff" }
rust_decimal = { version = "1.43", optional = true }
bigdecimal   = { version = "0.4.10", optional = true }
uuid         = { version = "1.26.0", optional = true }
ulid         = { version = "3.0.0", optional = true }
serde_json   = { version = "1.0.151", optional = true }
ipnetwork    = { version = "0.21.1", optional = true }

[features]
default = []
# F10：启用 `raw_trusted*` 等受信任原始 SQL 的调用计数（与 F15 联动）。
metrics      = ["dep:metrics"]
chrono       = ["dep:chrono"]
time         = ["dep:time"]
jiff         = ["dep:jiff"]
rust_decimal = ["dep:rust_decimal"]
bigdecimal   = ["dep:bigdecimal"]
uuid         = ["dep:uuid"]
ulid         = ["dep:ulid"]
json         = ["dep:serde_json"]
ipnetwork    = ["dep:ipnetwork"]
