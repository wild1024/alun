[package]
name = "alun-cache"
description = "Alun cache abstraction: local in-memory cache + Redis integration"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/alun-cache"
readme = "README.md"
rust-version.workspace = true
keywords = ["cache", "redis", "in-memory", "web", "framework"]
categories = ["caching", "database", "web-programming"]

[dependencies]
alun-core = { workspace = true }
alun-config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
parking_lot = { workspace = true }
tracing = { workspace = true }
redis = { workspace = true }
# 可观测性埋点（F10）：可选。缓存命中/未命中与操作耗时。
metrics = { workspace = true, optional = true }

[features]
# F10 可观测性：缓存命中率与耗时埋点（挂在 `SharedCache` 统一入口上）
metrics = ["dep:metrics"]

[dev-dependencies]
tokio = { workspace = true }
