[package]
name = "alun-db"
version.workspace = true
edition = "2024"
description = "Alun database: Row 模式 + 事务 RAII + Hook + SQL 模板"
license = "MIT OR Apache-2.0"

[dependencies]
alun-db-core  = { version = "0.4.0", path = "../alun-db-core" }
alun-db-sql   = { version = "0.4.0", path = "../alun-db-sql" }
alun-db-macro = { version = "0.4.0", path = "../alun-db-macro" }

# 驱动
alun-db-driver-sqlite   = { version = "0.4.0", path = "../alun-db-driver-sqlite", optional = true }
alun-db-driver-postgres = { version = "0.4.0", path = "../alun-db-driver-postgres", optional = true }
alun-db-driver-mysql    = { version = "0.4.0", path = "../alun-db-driver-mysql", optional = true }

# 生态类型
chrono       = { version = "0.4.45",  optional = true }
time         = { version = "0.3.55",  optional = true }
jiff         = { version = "0.2.37",  optional = true }
rust_decimal = { version = "1.43",    optional = true }
bigdecimal   = { version = "0.4.10",  optional = true }
uuid         = { version = "1.26.0",  optional = true }
ulid         = { version = "3.0.0",   optional = true }
serde_json   = { version = "1.0.151", optional = true }
ipnetwork    = { version = "0.21.1",  optional = true }

# 内部工具
# 可观测性埋点（F10）：可选。DB 查询耗时/计数、多租户安全指标。
metrics     = { workspace = true, optional = true }
thiserror = "2.0.20"
# 迁移内容指纹（SHA-256）：RustCrypto 实现，x86 平台含 SHA-NI 硬件加速路径
sha2      = "0.10"
tokio     = { version = "1.53", features = ["sync", "rt", "time"], optional = true }
tracing   = "0.1"

[features]
# 默认**不含任何驱动**：驱动按目标数据库显式选择（`sqlite` / `postgres` / `mysql`）。
# 只开 `async` 时 crate 可编译，建池阶段返回
# `DbError::UnsupportedFeature { feature: "driver", dialect: ".." }`。
default = ["async"]

# 驱动
sqlite   = ["dep:alun-db-driver-sqlite"]
postgres = ["dep:alun-db-driver-postgres"]
mysql    = ["dep:alun-db-driver-mysql"]

# 异步/同步
# `rt-multi-thread`：SQLite 驱动在多线程运行时下用 `block_in_place` 就地执行
# 同步查询（省掉 spawn_blocking 的线程往返），该 API 被 tokio 置于此 feature 下
async = ["dep:tokio", "tokio/rt-multi-thread"]
sync  = []

# F10 可观测性：DB 查询埋点 + 多租户安全指标（同时打开 core 侧 `raw_trusted` 计数）
metrics = ["dep:metrics", "alun-db-core/metrics"]

# 生态类型
chrono       = ["dep:chrono",       "alun-db-core/chrono"]
time         = ["dep:time",         "alun-db-core/time"]
jiff         = ["dep:jiff",         "alun-db-core/jiff"]
rust_decimal = ["dep:rust_decimal", "alun-db-core/rust_decimal"]
bigdecimal   = ["dep:bigdecimal",   "alun-db-core/bigdecimal"]
uuid         = ["dep:uuid",         "alun-db-core/uuid"]
ulid         = ["dep:ulid",         "alun-db-core/ulid"]
json         = ["dep:serde_json",   "alun-db-core/json"]
ipnetwork    = ["dep:ipnetwork",    "alun-db-core/ipnetwork"]

[dev-dependencies]
# 自引用 dev 依赖：仅为本 crate 的测试 / 示例构建统一开启生态类型特性，
# 使 `cargo test` 无需显式 `--features` 即可编译（生产功能不受影响）。
alun-db = { path = ".", features = ["chrono", "time", "jiff", "rust_decimal", "bigdecimal", "uuid", "ulid", "json", "ipnetwork"] }
alun-db-core = { version = "0.4.0", path = "../alun-db-core" }
alun-db-sql  = { version = "0.4.0", path = "../alun-db-sql" }
tokio        = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "rt"] }
chrono       = { version = "0.4.45", features = ["clock"] }
time         = { version = "0.3.55" }
# 测试中实现 `AsyncHook` 需要 `#[async_trait]`（与 trait 定义处的展开保持一致）。
async-trait  = { workspace = true }
serde        = { version = "1", features = ["derive"] }
serde_json   = { version = "1.0.151" }
# 基准对比基线：rusqlite 是 SQLite 驱动自己的底层库，与 alun-db 共用同一份
# libsqlite3，是最公平的「下界」。版本须与 alun-db-driver-sqlite 保持一致，
# 否则 `links` 会报冲突。
rusqlite     = { version = "0.40.2", features = ["bundled"] }
# 租户隔离开销基准：用 criterion 的统计框架输出开 / 关隔离的耗时对比。
criterion    = { version = "0.5", features = ["async_tokio"] }
# F10 测试：断言指标**真的被采集**（需要真实 recorder 才能渲染出文本）
# 关掉自带 HTTP 监听器，只取 recorder 与 handle。
metrics-exporter-prometheus = { workspace = true }

# ==================== 基准测试 ====================
# 自定义 main（harness = false），同时输出「耗时 + Rust 堆分配」对照表，
# 因此不使用 criterion 的统计框架。
[[bench]]
name = "db_compare"
harness = false

# 租户隔离开销：同一张 10 万行表，开 / 关隔离各跑点查、分页、批量插入。
[[bench]]
name = "tenant_isolation"
harness = false

[build-dependencies]
alun-db-build = { version = "0.4.0", path = "../alun-db-build" }
