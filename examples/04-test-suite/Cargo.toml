[package]
name = "alun-test-suite"
description = "Alun framework comprehensive test suite - functional tests and real-world scenario tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# `default-features = false`：本套件只用 `alun-web` 及各分层 crate，不使用
# `task` / `kafka`。若不关闭默认特性，会被默认集拉入 `alun-kafka`
# （librdkafka 需完整 Unix 构建链），导致在受限环境下无法运行。
#
# 注意：`sqlite` 必须显式声明——`db` 只是"数据库能力"，**不再隐含驱动**。
alun = { path = "../../alun", default-features = false, features = ["sqlite", "cache", "template", "fs-local", "config"] }
alun-core = { workspace = true }
alun-web = { workspace = true, features = ["sqlite", "cache", "template", "config"] }
alun-db = { workspace = true, features = ["sqlite"] }
alun-cache = { workspace = true }
alun-config = { workspace = true }
alun-template = { workspace = true }
alun-fs = { workspace = true }
alun-utils = { workspace = true, features = ["validator-integration", "xlsx"] }
alun-macros = { workspace = true }
tokio = { workspace = true, features = ["full"] }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
validator = { version = "0.21", features = ["derive"] }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
uuid = { version = "1.26", features = ["v4"] }
tower = { workspace = true }
http = { workspace = true }
anyhow = { workspace = true }
regex = "1.13"
rand = "0.10"
async-trait = { workspace = true }
parking_lot = { workspace = true }
toml = "1.1"